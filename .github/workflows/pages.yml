name: Build Lokhit Maharashtra and publish to site root
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/**'
      - 'admin/**'
      - 'build.py'
      - 'site.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lokhit-root-sync
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site and CMS JavaScript
        run: |
          node --check assets/js/admin.js
          node --check assets/js/cms.js
          node --check assets/js/site.js
      - name: Build Marathi news portal and all article pages
        run: python build.py
      - name: Sync finished website to repository root
        run: |
          cp -a docs/. ./
          rm -rf docs
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build and publish latest Lokhit Maharashtra website [skip ci]"
            git push origin HEAD:main
          else
            echo "Published HTML is already up to date"
          fi
