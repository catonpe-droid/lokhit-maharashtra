name: Publish Lokhit Maharashtra
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/**'
      - 'admin/**'
      - 'build.py'
      - 'site.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Mini CMS and website JavaScript
        run: |
          node --check assets/js/admin.js
          node --check assets/js/cms.js
          node --check assets/js/site.js
      - name: Build 20+ Marathi stories and SEO pages
        run: python build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
