name: Build Lokhit Maharashtra and publish to site root
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/**'
      - 'backend/**'
      - 'admin/**'
      - 'news-submit/**'
      - 'build.py'
      - 'rich_renderer.py'
      - 'tina_markdown.py'
      - 'tests/**'
      - 'site.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lokhit-root-sync
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site and CMS JavaScript
        run: |
          node --check news-submit/publisher.js
          node --check --input-type=module < backend/secret-publisher-worker.js
          node backend/test-secret-publisher.mjs
          node --check assets/js/studio.js
          python -m py_compile rich_renderer.py tina_markdown.py
          python -m unittest discover -s tests -v
          node --check assets/js/admin.js
          node --check admin/test/publisher.js
          node --check assets/js/pin-admin.js
          node --check assets/js/cms.js
          node --check assets/js/site.js
          node --check assets/js/sheets-public.js
          node --check --input-type=commonjs < backend/sheets-admin-code.gs
          node --check assets/js/google-admin.js
          node --check assets/js/pin-admin.js
          node --check assets/js/sheets-admin-client.js
          python -m py_compile backend/sync_sheet_feed.py
          node --check --input-type=module < backend/pin-worker.js
          node backend/test-pin-worker.mjs
          node --check --input-type=module < backend/worker.js
          node backend/test-worker.mjs
      - name: Build Marathi news portal and all article pages
        run: python build.py
      - name: Sync finished website to repository root
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Publish attempt ${attempt}: refreshing latest source and rebuilding"
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs
            python build.py
            # The site lives at repository root. cp -a does NOT remove old
            # pages, so deleting a post JSON previously left its old HTML live.
            # Compare generated article pages with the existing public root;
            # remove only stale article directories absent from this build.
            if [ -d batmi ]; then
              for article_dir in batmi/*/; do
                [ -d "$article_dir" ] || continue
                if [ ! -f "docs/${article_dir}index.html" ]; then
                  echo "Removing deleted or unpublished article: $article_dir"
                  rm -rf -- "$article_dir"
                fi
              done
            fi
            cp -a docs/. ./
            rm -rf docs
            git add -A
            if git diff --cached --quiet; then
              echo "Website files already current."
              exit 0
            fi
            git commit -m "Build and publish latest Lokhit Maharashtra website [skip ci]"
            if git push origin HEAD:main; then
              echo "Latest website successfully synced to main."
              exit 0
            fi
            echo "A newer commit arrived. Retrying with latest repository."
            sleep 2
          done
          echo "Could not publish after 4 safe attempts."
          exit 1
