name: Sync Lokhit News from Google Sheets Admin
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-sheets.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lokhit-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve approved news and editor settings
        run: python backend/sync_sheet_feed.py
      - name: Commit changes back to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lokhit-news-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts content/layout.json content/sheet-sync-manifest.json site.json
          if git diff --staged --quiet; then
            echo "No new published news."
            exit 0
          fi
          git commit -m "Publish news and editor settings from Lokhit Google Sheets"
          for n in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "News content synced. Dispatching website rebuild."
              GH_TOKEN="${{ github.token }}" gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" -f ref=main
              exit 0
            fi
            sleep 3
          done
          echo "Unable to push synced news after retries." >&2
          exit 1
