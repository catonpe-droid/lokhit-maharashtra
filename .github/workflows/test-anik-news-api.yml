name: Check ANIK News Publisher API
on:
  push:
    branches: [main]
    paths:
      - 'backend/anik-news-api/**'
      - '.github/workflows/test-anik-news-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile ANIK News API
        run: dotnet build backend/anik-news-api/AnikNewsApi.csproj -c Release --nologo
