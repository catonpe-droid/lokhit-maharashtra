name = "lokhit-pin-admin"
main = "pin-worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
SITE_ORIGINS = "https://catonpe-droid.github.io"

# Connect a free KV namespace through Cloudflare Dashboard:
# Worker > Settings > Bindings > Add > KV Namespace
# Variable name: LOGIN_KV
# For CLI/Wrangler deployment only, uncomment and provide your own namespace ID:
# [[kv_namespaces]]
# binding = "LOGIN_KV"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[secrets]
required = ["EDITOR_PIN", "SESSION_SECRET", "GITHUB_TOKEN"]
